name: AMECO Fiscal Reaction Source Structure Probe

# Live provider refresh is manual-only. The exact Spring-2026 structure used
# by the retained 2026-09-19 vintage is already preserved in the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-ameco-fiscal-reaction-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run exact AMECO source-structure probe
        env:
          FISCAL_REACTION_AMECO_PROBE_OUT: fiscal_reaction_ameco_probe_artifacts
        run: python scripts/audit_ameco_fiscal_reaction_source_structure.py

      - name: Upload AMECO structure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ameco-fiscal-reaction-source-probe-${{ github.sha }}
          path: fiscal_reaction_ameco_probe_artifacts/
          if-no-files-found: error
          retention-days: 90
