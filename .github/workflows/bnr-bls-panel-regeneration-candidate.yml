name: BNR BLS Panel Regeneration Candidate

on:
  pull_request:
    paths:
      - "model/calibration_validation/bnr_bls_panel_regeneration_candidate_contract.json"
      - "model/calibration_validation/bnr_bls_missing_round_semantic_mapping_audit.json"
      - "model/calibration_validation/bnr_bls_cross_round_mapping_audit.json"
      - "data/processed/bnr_bls_realised_rounds.csv"
      - "scripts/review_bnr_bls_panel_regeneration_candidate.py"
      - "tests/test_bnr_bls_panel_regeneration_candidate_contract.py"
      - ".github/workflows/bnr-bls-panel-regeneration-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate-without-canonical-mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify frozen panel-regeneration candidate contract
        run: |
          python -m unittest tests.test_bnr_bls_panel_regeneration_candidate_contract -v

      - name: Build isolated eleven-round candidate
        env:
          BNR_BLS_PANEL_REGENERATION_OUT: bnr_bls_panel_regeneration_candidate_artifacts
        run: python scripts/review_bnr_bls_panel_regeneration_candidate.py

      - name: Prove canonical panel remains byte-clean
        run: |
          git diff --exit-code -- data/processed/bnr_bls_realised_rounds.csv
          git diff --exit-code -- model/calibration_validation/bnr_bls_cross_round_mapping_audit.json

      - name: Upload candidate panel and audit only
        uses: actions/upload-artifact@v4
        with:
          name: bnr-bls-panel-regeneration-candidate-${{ github.sha }}
          path: bnr_bls_panel_regeneration_candidate_artifacts/
          if-no-files-found: error
          retention-days: 90
