name: CI

on:
  push:
    branches: [main, alpha-0.1.0a0-foundation]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Run foundation tests
        run: python -m pytest
