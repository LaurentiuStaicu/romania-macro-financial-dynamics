name: F2M External Identity Audit\n\non:\n  pull_request:\n    paths:\n      - "model/accounting/f2m_external_identity_contract.json"\n      - "scripts/audit_qsa_f2m_external_identity.py"\n      - ".github/workflows/f2m-external-identity-audit.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  audit-f2m-external-complement:\n    runs-on: ubuntu-latest\n\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v7\n\n      - name: Set up Python 3.12\n        uses: actions/setup-python@v7\n        with:\n          python-version: "3.12"\n\n      - name: Re-run Phase A1 F2M coverage audit\n        env:\n          F2M_AUDIT_OUT: f2m_audit_artifacts\n        run: python scripts/audit_qsa_f2m_deposit_coverage.py\n\n      - name: Test QSA W0/W2/W1 external complement identities\n        env:\n          F2M_AUDIT_IN: f2m_audit_artifacts\n          F2M_EXTERNAL_AUDIT_OUT: f2m_external_audit_artifacts\n        run: python scripts/audit_qsa_f2m_external_identity.py\n\n      - name: Upload Phase A1 and A2 audit evidence\n        uses: actions/upload-artifact@v4\n        with:\n          name: f2m-external-identity-${{ github.sha }}\n          path: |\n            f2m_audit_artifacts/\n            f2m_external_audit_artifacts/\n          if-no-files-found: error\n          retention-days: 30\n