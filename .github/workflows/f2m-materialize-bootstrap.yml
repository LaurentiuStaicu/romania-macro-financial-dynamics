name: F2M materialize bootstrap

on:
  push:
    branches:
      - accounting/f2m-component-materialization
    paths:
      - ".github/workflows/f2m-materialize-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: accounting/f2m-component-materialization
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify retained source vintage
        run: python scripts/verify_f2m_source_vintage.py

      - name: Materialize F2M component offline
        run: |
          python scripts/generate_f2m_component_from_snapshot.py \
            --component-output model/accounting/f2m_component_2025.json \
            --manifest-output model/accounting/f2m_materialization_manifest.json

      - name: Run materialization tests
        run: python -m unittest tests.test_f2m_materialization -v

      - name: Commit deterministic generated artifacts and remove bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/accounting/f2m_component_2025.json
          git add model/accounting/f2m_materialization_manifest.json
          git rm .github/workflows/f2m-materialize-bootstrap.yml
          git commit -m "Materialize deposits-only F2M accounting component"
          git push origin HEAD:accounting/f2m-component-materialization
