name: Temporary F3 Benchmark Materialization

on:
  push:
    branches:
      - accounting/f3-materialization

permissions:
  contents: write

jobs:
  materialize-f3-benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: accounting/f3-materialization

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify source vintage offline
        run: python scripts/verify_f3_source_vintage.py

      - name: Materialize F3 benchmark offline
        run: |
          python scripts/generate_f3_benchmark_from_snapshot.py \
            --benchmark-input model/accounting/benchmark_2025.json \
            --benchmark-output /tmp/benchmark_2025.json \
            --materialization-output /tmp/f3_materialization_manifest.json
          mv /tmp/benchmark_2025.json model/accounting/benchmark_2025.json
          mv /tmp/f3_materialization_manifest.json model/accounting/f3_materialization_manifest.json

      - name: Run accounting and materialization tests
        run: python -m unittest tests.test_dynamic_core tests.test_f3_materialization -v

      - name: Commit audited F3 materialization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/accounting/benchmark_2025.json model/accounting/f3_materialization_manifest.json
          if git diff --cached --quiet; then
            echo "No F3 materialization changes."
            exit 0
          fi
          git commit -m "accounting: materialize reconciled F3 stock and flow matrices"
          git push origin HEAD:accounting/f3-materialization
