name: F4 Partial Materialization Audit

on:
  pull_request:
    paths:
      - "data/source_vintages/accounting-f4-partial-2025-vintage-2026-09-18/**"
      - "model/accounting/f4_partial_materialization_contract.json"
      - "model/accounting/f4_partial_2025.json"
      - "model/accounting/f4_partial_materialization_manifest.json"
      - "scripts/generate_f4_partial_from_snapshot.py"
      - "scripts/verify_f4_partial_source_vintage.py"
      - "tests/test_f4_partial_materialization.py"
      - ".github/workflows/f4-partial-materialization-audit.yml"
      - "model/accounting/source_registry.json"
      - "model/accounting/reconciliation_2025.json"
      - "STATUS.md"
  push:
    branches:
      - main
    paths:
      - "data/source_vintages/accounting-f4-partial-2025-vintage-2026-09-18/**"
      - "model/accounting/f4_partial_materialization_contract.json"
      - "model/accounting/f4_partial_2025.json"
      - "model/accounting/f4_partial_materialization_manifest.json"
      - "scripts/generate_f4_partial_from_snapshot.py"
      - "scripts/verify_f4_partial_source_vintage.py"
      - "tests/test_f4_partial_materialization.py"
      - ".github/workflows/f4-partial-materialization-audit.yml"
      - "model/accounting/source_registry.json"
      - "model/accounting/reconciliation_2025.json"
      - "STATUS.md"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  verify-f4-partial:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Retain exact Phase B artifact and generate partial F4 if absent
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "10558980689"
          EXPECTED_SHA256: "a01922ed3662725dd5c73c95cd248bb97c8fc8a06404c9507e7cac4fc8e260aa"
        run: |
          set -euo pipefail
          VINTAGE="data/source_vintages/accounting-f4-partial-2025-vintage-2026-09-18"
          B64="$VINTAGE/workflow_artifact_10558980689.zip.b64"
          mkdir -p "$VINTAGE"
          if [ ! -f "$B64" ]; then
            curl --fail --location               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer $GH_TOKEN"               --header "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"               --output /tmp/f4-phase-b.zip
            echo "$EXPECTED_SHA256  /tmp/f4-phase-b.zip" | sha256sum --check
            base64 -w 76 /tmp/f4-phase-b.zip > "$B64"
          fi
          python scripts/generate_f4_partial_from_snapshot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$B64" model/accounting/f4_partial_2025.json model/accounting/f4_partial_materialization_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "accounting: retain and materialize unconditional partial F4 core"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Verify immutable source vintage offline
        run: python scripts/verify_f4_partial_source_vintage.py

      - name: Run partial F4 materialization tests
        run: python -m unittest tests.test_f4_partial_materialization -v

      - name: Regenerate partial F4 entirely offline
        run: |
          mkdir -p generated
          python scripts/generate_f4_partial_from_snapshot.py             --component-output generated/f4_partial_2025.json             --manifest-output generated/f4_partial_materialization_manifest.json

      - name: Require deterministic semantic reproduction
        run: |
          python scripts/check_json_semantic_equivalence.py             model/accounting/f4_partial_2025.json             generated/f4_partial_2025.json
          python scripts/check_json_semantic_equivalence.py             model/accounting/f4_partial_materialization_manifest.json             generated/f4_partial_materialization_manifest.json

      - name: Upload regenerated evidence
        uses: actions/upload-artifact@v4
        with:
          name: f4-partial-materialization-${{ github.sha }}
          path: generated/
          if-no-files-found: error
          retention-days: 90
