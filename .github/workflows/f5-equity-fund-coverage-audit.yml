name: F5 Equity and Fund Coverage Audit

on:
  pull_request:
    paths:
      - "model/accounting/f5_equity_fund_coverage_contract.json"
      - "scripts/audit_qsa_f5_equity_fund_coverage.py"
      - "tests/test_f5_equity_fund_coverage_contract.py"
      - ".github/workflows/f5-equity-fund-coverage-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-f5-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify F5 coverage contract
        run: python -m unittest tests.test_f5_equity_fund_coverage_contract -v

      - name: Probe exact ECB QSA F5 coverage
        env:
          F5_AUDIT_OUT: f5_audit_artifacts
        run: python scripts/audit_qsa_f5_equity_fund_coverage.py

      - name: Upload F5 coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: f5-equity-fund-coverage-${{ github.sha }}
          path: f5_audit_artifacts/
          if-no-files-found: error
          retention-days: 30
