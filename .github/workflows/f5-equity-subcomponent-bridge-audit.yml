name: F5 Equity Subcomponent Bridge Audit

# Historical scientific conclusions are reproduced from retained repository
# snapshots/assessments. This workflow intentionally performs a live provider
# refresh only when explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-f5-equity-subcomponents:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify F5 equity-subcomponent contract
        run: python -m unittest tests.test_f5_equity_subcomponent_bridge_contract -v

      - name: Probe bilateral F511 F512 F519 and retained F52 scope
        env:
          F5_EQUITY_OUT: f5_equity_artifacts
        run: python scripts/audit_qsa_f5_equity_subcomponents.py

      - name: Upload F5 equity-subcomponent evidence
        uses: actions/upload-artifact@v4
        with:
          name: f5-equity-subcomponent-bridge-${{ github.sha }}
          path: f5_equity_artifacts/
          if-no-files-found: error
          retention-days: 90
