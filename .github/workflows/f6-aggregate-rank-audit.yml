name: F6 Aggregate Rank Audit
on:
  pull_request:
    paths:
      - "model/accounting/f6_aggregate_rank_contract.json"
      - "model/accounting/f6_insurance_pensions_coverage_contract.json"
      - "scripts/audit_qsa_f6_insurance_pensions_coverage.py"
      - "scripts/audit_f6_aggregate_rank.py"
      - "tests/test_f6_aggregate_rank_contract.py"
      - ".github/workflows/f6-aggregate-rank-audit.yml"
      - "model/accounting/reconciliation_2025.json"
      - "STATUS.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-f6-rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Check out repository
      - uses: actions/setup-python@v7
        name: Set up Python 3.12
        with:
          python-version: "3.12"
      - name: Verify F6 rank contract
        run: python -m unittest tests.test_f6_aggregate_rank_contract -v
      - name: Reproduce F6 Phase A aggregate evidence
        env:
          F6_AUDIT_OUT: f6_phase_a_artifacts
        run: python scripts/audit_qsa_f6_insurance_pensions_coverage.py
      - name: Run exact F6 aggregate rank audit
        run: |
          python scripts/audit_f6_aggregate_rank.py             --phase-a-report f6_phase_a_artifacts/f6_insurance_pensions_coverage_audit.json             --out f6_rank_artifacts
      - uses: actions/upload-artifact@v4
        name: Upload F6 rank evidence
        with:
          name: f6-aggregate-rank-${{ github.sha }}
          path: |
            f6_phase_a_artifacts/
            f6_rank_artifacts/
          if-no-files-found: error
          retention-days: 30
