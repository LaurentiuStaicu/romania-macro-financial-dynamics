name: F6 Aggregate Rank Audit

on:
  pull_request:
    paths:
      - "model/accounting/f6_aggregate_rank_contract.json"
      - "model/accounting/f6_aggregate_rank_assessment.json"
      - "model/accounting/f6_insurance_pensions_coverage_assessment.json"
      - "scripts/audit_f6_aggregate_rank.py"
      - "tests/test_f6_aggregate_rank_contract.py"
      - ".github/workflows/f6-aggregate-rank-audit.yml"
      - "model/accounting/reconciliation_2025.json"
      - "STATUS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-f6-rank:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify F6 rank contract and retained assessment
        run: python -m unittest tests.test_f6_aggregate_rank_contract -v

      - name: Reproduce F6 rank audit offline
        run: python scripts/audit_f6_aggregate_rank.py --out f6_rank_artifacts

      - name: Upload F6 rank evidence
        uses: actions/upload-artifact@v4
        with:
          name: f6-aggregate-rank-${{ github.sha }}
          path: f6_rank_artifacts/
          if-no-files-found: error
          retention-days: 30
