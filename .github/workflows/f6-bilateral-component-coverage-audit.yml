name: F6 Bilateral Component Coverage Audit
on:
  pull_request:
    paths:
      - "model/accounting/f6_bilateral_component_coverage_contract.json"
      - "scripts/audit_qsa_f6_bilateral_components.py"
      - "tests/test_f6_bilateral_component_coverage_contract.py"
      - ".github/workflows/f6-bilateral-component-coverage-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-f6-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Check out repository
      - uses: actions/setup-python@v7
        name: Set up Python 3.12
        with:
          python-version: "3.12"
      - name: Verify F6 component contract
        run: python -m unittest tests.test_f6_bilateral_component_coverage_contract -v
      - name: Probe bilateral F6 subcomponents
        env:
          F6_COMPONENT_OUT: f6_component_artifacts
        run: python scripts/audit_qsa_f6_bilateral_components.py
      - uses: actions/upload-artifact@v4
        name: Upload F6 component evidence
        with:
          name: f6-bilateral-components-${{ github.sha }}
          path: f6_component_artifacts/
          if-no-files-found: error
          retention-days: 90
