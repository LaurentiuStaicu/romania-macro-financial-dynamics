name: F7 Financial Derivatives Coverage Audit

on:
  pull_request:
    paths:
      - "model/accounting/f7_financial_derivatives_coverage_contract.json"
      - "scripts/audit_qsa_f7_financial_derivatives_coverage.py"
      - "tests/test_f7_financial_derivatives_coverage_contract.py"
      - ".github/workflows/f7-financial-derivatives-coverage-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-f7-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify F7 coverage contract
        run: python -m unittest tests.test_f7_financial_derivatives_coverage_contract -v

      - name: Probe exact ECB QSA F7 coverage
        env:
          F7_AUDIT_OUT: f7_audit_artifacts
        run: python scripts/audit_qsa_f7_financial_derivatives_coverage.py

      - name: Upload F7 source-coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: f7-financial-derivatives-coverage-${{ github.sha }}
          path: f7_audit_artifacts/
          if-no-files-found: error
          retention-days: 90
