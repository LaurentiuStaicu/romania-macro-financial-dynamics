name: F8 Bilateral Component Bridge Audit

on:
  pull_request:
    paths:
      - "model/accounting/f8_bilateral_component_bridge_contract.json"
      - "scripts/audit_qsa_f8_bilateral_components.py"
      - "tests/test_f8_bilateral_component_bridge_contract.py"
      - ".github/workflows/f8-bilateral-component-bridge-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-f8-components:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify F8 component-bridge contract
        run: python -m unittest tests.test_f8_bilateral_component_bridge_contract -v

      - name: Probe bilateral F81 and F89 coverage
        env:
          F8_COMPONENT_OUT: f8_component_artifacts
        run: python scripts/audit_qsa_f8_bilateral_components.py

      - name: Upload F8 component-bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: f8-bilateral-component-bridge-${{ github.sha }}
          path: f8_component_artifacts/
          if-no-files-found: error
          retention-days: 90
