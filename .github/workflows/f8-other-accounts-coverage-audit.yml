name: F8 Other Accounts Coverage Audit

# Historical scientific conclusions are reproduced from retained repository
# snapshots/assessments. This workflow intentionally performs a live provider
# refresh only when explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-f8-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify F8 coverage contract
        run: python -m unittest tests.test_f8_other_accounts_coverage_contract -v

      - name: Probe exact ECB QSA F8 coverage
        env:
          F8_AUDIT_OUT: f8_audit_artifacts
        run: python scripts/audit_qsa_f8_other_accounts_coverage.py

      - name: Upload F8 coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: f8-other-accounts-coverage-${{ github.sha }}
          path: f8_audit_artifacts/
          if-no-files-found: error
          retention-days: 90
