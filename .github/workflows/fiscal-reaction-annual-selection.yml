name: Fiscal Reaction Annual Structural Selection

# One-shot preregistered structural-selection execution. This workflow may
# access only the retained source years through 2017 via the guarded runner.
# Final evaluation 2018-2024 is explicitly unauthorized.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  run-frozen-selection:
    if: ${{ github.event.label.name == 'run-fiscal-reaction-selection' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Verify frozen contract and runner tests
        run: |
          python -m unittest tests.test_fiscal_reaction_annual_structural_selection_contract -v
          python -m unittest tests.test_fiscal_reaction_annual_selection_runner -v

      - name: Run authorized structural selection only
        run: |
          python scripts/run_fiscal_reaction_annual_structural_selection.py --execute-selection

      - name: Consume execution gate and commit immutable result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          gate_path = Path(
              "model/calibration_validation/"
              "fiscal_reaction_annual_selection_execution_gate.json"
          )
          result_path = Path(
              "model/calibration_validation/"
              "fiscal_reaction_annual_structural_selection_result.json"
          )
          if not result_path.exists():
              raise SystemExit("selection result was not created")
          result = json.loads(result_path.read_text(encoding="utf-8"))
          if result.get("final_evaluation_opened") is not False:
              raise SystemExit("final evaluation was unexpectedly opened")
          if result.get("system_dynamics_activation") is not False:
              raise SystemExit("System Dynamics activation changed")
          if result.get("behavioural_closure_change") is not False:
              raise SystemExit("behavioural closure changed")

          gate = json.loads(gate_path.read_text(encoding="utf-8"))
          gate["selection_execution_authorized"] = False
          gate["selection_execution_consumed"] = True
          gate["consumed_by_result"] = str(result_path)
          gate["final_evaluation_authorized"] = False
          gate_path.write_text(
              json.dumps(gate, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             model/calibration_validation/fiscal_reaction_annual_selection_execution_gate.json             model/calibration_validation/fiscal_reaction_annual_structural_selection_result.json
          git commit -m "fiscal: retain one-shot annual structural-selection result"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
