name: FX External Price Product Boundary Probe

# Manual/one-shot PR bootstrap source-structure probe. No model fit.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  probe-external-price-product-boundary:
    if: ${{ github.event.label.name == 'run-fx-external-price-probe' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Probe exact Eurostat Romania imports/world product boundary
        env:
          FX_EXTERNAL_PRICE_PROBE_OUT: fx_external_price_probe_artifacts
        run: python scripts/audit_fx_external_price_product_boundary.py

      - name: Upload source-structure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-external-price-product-probe-${{ github.sha }}
          path: fx_external_price_probe_artifacts/
          if-no-files-found: error
          retention-days: 90
