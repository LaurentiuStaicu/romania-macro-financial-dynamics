name: FX HICP Source Structure Probe

# One-shot PR bootstrap probe. No transform selection and no model fit.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  probe-hicp-source-structure:
    if: ${{ github.event.label.name == 'run-fx-hicp-structure-probe' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Probe exact Eurostat Romania CP00 HICP structure
        env:
          FX_HICP_STRUCTURE_PROBE_OUT: fx_hicp_structure_probe_artifacts
        run: python scripts/audit_fx_hicp_source_structure.py

      - name: Upload HICP structure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-hicp-structure-probe-${{ github.sha }}
          path: fx_hicp_structure_probe_artifacts/
          if-no-files-found: error
          retention-days: 90
