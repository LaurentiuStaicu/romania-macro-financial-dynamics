name: FX Inflation Monthly Source Materialisation

# Live provider materialisation is a one-shot PR bootstrap trigger.
# The result is source evidence only and performs no transforms or estimation.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  materialise-fx-inflation-monthly-sources:
    if: ${{ github.event.label.name == 'run-fx-inflation-materialisation' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify frozen materialisation contracts
        run: |
          python -m unittest tests.test_fx_inflation_external_price_control_contract -v
          python -m unittest tests.test_fx_inflation_monthly_materialisation_contract -v

      - name: Run exact live level-only source materialisation
        env:
          FX_INFLATION_MATERIALISATION_OUT: fx_inflation_materialisation_artifacts
        run: python scripts/audit_fx_inflation_monthly_materialisation.py

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-inflation-monthly-materialisation-${{ github.sha }}
          path: fx_inflation_materialisation_artifacts/
          if-no-files-found: error
          retention-days: 90
