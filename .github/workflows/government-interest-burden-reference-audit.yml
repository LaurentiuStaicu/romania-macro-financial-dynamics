name: Government Interest Burden Reference Audit

on:
  pull_request:
    paths:
      - "model/dynamics/government_interest_burden_reference_contract.json"
      - "scripts/audit_eurostat_government_interest_burden_reference.py"
      - "tests/test_government_interest_burden_reference_contract.py"
      - ".github/workflows/government-interest-burden-reference-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-government-interest-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify government-interest reference contract
        run: python -m unittest tests.test_government_interest_burden_reference_contract -v

      - name: Probe Eurostat D41PAY reference series
        env:
          GOV_INTEREST_REFERENCE_AUDIT_OUT: government_interest_reference_audit_artifacts
        run: python scripts/audit_eurostat_government_interest_burden_reference.py

      - name: Upload government-interest reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: government-interest-burden-reference-${{ github.sha }}
          path: government_interest_reference_audit_artifacts/
          if-no-files-found: error
          retention-days: 90
