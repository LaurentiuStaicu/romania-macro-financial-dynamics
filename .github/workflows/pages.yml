name: InfoClar Pages

on:
  pull_request:
    paths:
      - 'web/**'
      - 'tests/test_suite_visual_alignment.py'
      - 'scripts/build_web.py'
      - 'scripts/run_suite_visual_gate.py'
      - '.github/workflows/pages.yml'
      - 'model/calibration_validation/**'
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'tests/test_suite_visual_alignment.py'
      - 'scripts/build_web.py'
      - 'scripts/run_suite_visual_gate.py'
      - '.github/workflows/pages.yml'
      - 'model/calibration_validation/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build canonical InfoClar site
        run: python scripts/build_web.py

      - name: Verify built project-site entrypoint
        run: |
          test -f dist/pages/index.html
          test -f dist/pages/suite-tokens.css
          test -f dist/pages/public/model-stage.json
          test -f dist/pages/public/theory-supplement.json
          grep -q 'FLOW-OF-FUNDS / SECTORAL BALANCE-SHEET EXPLORER' dist/pages/index.html
          grep -q 'STOCK / BALANCE-SHEET VIEW' dist/pages/index.html
          grep -q 'FLOW VIEW' dist/pages/index.html
          grep -q 'suite-tokens.css' dist/pages/styles.css

      - name: Install visual comparison helpers
        run: python -m pip install --disable-pip-version-check pillow playwright

      - name: Render exact-viewport Suite Visual Alignment Gate
        run: |
          set -euo pipefail
          python -m http.server 8123 --directory dist/pages > /tmp/infoclar-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          WORLD3_URL='https://laurentiustaicu.github.io/world3-empirical-flatpak/'
          curl --fail --silent --show-error --location "$WORLD3_URL" -o /tmp/world3-index.html

          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chromium-compatible browser available for mandatory visual QA" >&2
            exit 1
          fi

          python scripts/run_suite_visual_gate.py \
            --browser "$BROWSER" \
            --macro-url 'http://127.0.0.1:8123/' \
            --world3-url "$WORLD3_URL" \
            --output visual-qa

          test -s visual-qa/audit/visual-gate-report.json
          grep -q '"viewport": \[' visual-qa/audit/visual-gate-report.json
          for capture in visual-qa/macro/*.png visual-qa/world3/*.png visual-qa/side-by-side/*.png; do
            test -s "$capture"
          done

      - name: Upload Suite Visual Alignment Gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suite-visual-alignment-qa
          path: visual-qa
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy verified build artifact
        id: deployment
        uses: actions/deploy-pages@v4
