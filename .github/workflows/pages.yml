name: InfoClar Pages

on:
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/build_web.py'
      - '.github/workflows/pages.yml'
      - 'model/calibration_validation/**'
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'scripts/build_web.py'
      - '.github/workflows/pages.yml'
      - 'model/calibration_validation/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build canonical InfoClar site
        run: python scripts/build_web.py

      - name: Verify built project-site entrypoint
        run: |
          test -f dist/pages/index.html
          test -f dist/pages/public/model-stage.json
          test -f dist/pages/public/theory-supplement.json
          grep -q 'FLOW-OF-FUNDS EXPLORER' dist/pages/index.html
          grep -q 'STOCK / BALANCE-SHEET VIEW' dist/pages/index.html
          grep -q 'FLOW VIEW' dist/pages/index.html

      - name: Render desktop and mobile visual QA captures
        run: |
          mkdir -p visual-qa
          python -m http.server 8123 --directory dist/pages > /tmp/infoclar-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chromium-compatible browser available for mandatory visual QA" >&2
            exit 1
          fi
          COMMON="--headless --disable-gpu --no-sandbox --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=5000"
          "$BROWSER" $COMMON --window-size=1440,1200 --screenshot=visual-qa/desktop-overview.png http://127.0.0.1:8123/
          "$BROWSER" $COMMON --window-size=1440,1200 --screenshot=visual-qa/desktop-dashboard.png 'http://127.0.0.1:8123/#dashboard-panel'
          "$BROWSER" $COMMON --window-size=390,844 --screenshot=visual-qa/mobile-overview.png http://127.0.0.1:8123/
          "$BROWSER" $COMMON --window-size=390,844 --screenshot=visual-qa/mobile-map.png 'http://127.0.0.1:8123/#network-view'
          "$BROWSER" $COMMON --window-size=390,844 --screenshot=visual-qa/mobile-dashboard.png 'http://127.0.0.1:8123/#dashboard-panel'
          for capture in visual-qa/*.png; do test -s "$capture"; done

      - name: Upload visual QA captures
        uses: actions/upload-artifact@v4
        with:
          name: infoclar-visual-qa
          path: visual-qa
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy verified build artifact
        id: deployment
        uses: actions/deploy-pages@v4
