name: Private Credit Reference Audit

# Live-source refresh is intentionally manual. The canonical scientific state is
# reproduced offline from retained snapshots/assessments in Scientific CI.
# A transient provider/network failure must not rewrite a validated vintage.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-private-credit-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify private-credit reference contract
        run: python -m unittest tests.test_private_credit_reference_contract -v

      - name: Probe ECB BSI stock and transaction series
        env:
          PRIVATE_CREDIT_REFERENCE_AUDIT_OUT: private_credit_reference_audit_artifacts
        run: python scripts/audit_ecb_private_credit_reference.py

      - name: Upload private-credit reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: private-credit-reference-${{ github.sha }}
          path: private_credit_reference_audit_artifacts/
          if-no-files-found: error
          retention-days: 90
