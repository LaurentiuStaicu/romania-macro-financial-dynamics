name: Promote Reviewed AMECO Fiscal Reaction Vintage

# One-shot promotion of an already reviewed workflow artifact. This never
# refetches AMECO and never estimates a behavioural equation.
on:
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: write

jobs:
  promote-reviewed-vintage:
    if: ${{ github.event.label.name == 'promote-ameco-fiscal-vintage' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Download exact reviewed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10580819452/zip"             -o /tmp/ameco-reviewed.zip
          echo "4827c71d166996a07237cc550461e5cf4d5077424ac72f9402280808fe5c6df6  /tmp/ameco-reviewed.zip" | sha256sum -c -

      - name: Verify every reviewed file
        run: |
          rm -rf /tmp/ameco-reviewed
          mkdir -p /tmp/ameco-reviewed
          unzip -q /tmp/ameco-reviewed.zip -d /tmp/ameco-reviewed
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/ameco-reviewed")
          review = json.loads(
              Path(
                  "model/calibration_validation/"
                  "fiscal_reaction_ameco_source_vintage_promotion_review.json"
              ).read_text(encoding="utf-8")
          )
          actual = {
              str(p.relative_to(root))
              for p in root.rglob("*")
              if p.is_file()
          }
          expected = {item["path"] for item in review["expected_files"]}
          if actual != expected:
              raise SystemExit(
                  f"artifact file set mismatch: missing={expected-actual}, extra={actual-expected}"
              )
          for item in review["expected_files"]:
              path = root / item["path"]
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != item["bytes"] or digest != item["sha256"]:
                  raise SystemExit(f"review mismatch for {item['path']}")
          print("Exact reviewed AMECO artifact verified.")
          PY

      - name: Commit immutable source vintage to PR branch
        run: |
          dest="data/source_vintages/fiscal-reaction-ameco-actual-vintage-2026-09-19"
          test ! -e "$dest"
          mkdir -p "$dest"
          cp -a /tmp/ameco-reviewed/. "$dest/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "data: retain exact AMECO fiscal-reaction source vintage"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
