name: Promote Reviewed BNR BLS Missing-Round Vintage

on:
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: write

jobs:
  promote-reviewed-bnr-bls-missing-round-vintage:
    if: ${{ github.event.label.name == 'promote-bnr-bls-missing-round-vintage' && github.event.pull_request.head.ref == 'audit/scientific-integrity-2026-09-18' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Download exact reviewed recovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10587121563/zip" \
            -o /tmp/bnr-bls-missing-round-reviewed.zip
          echo "974b97275fdd8c8d57f1a5dbcca67d3aef70ff397a996957bc9eaa2b6b779827  /tmp/bnr-bls-missing-round-reviewed.zip" | sha256sum -c -

      - name: Verify frozen file set, byte counts, hashes and signatures
        run: |
          rm -rf /tmp/bnr-bls-missing-round-reviewed
          mkdir -p /tmp/bnr-bls-missing-round-reviewed
          unzip -q /tmp/bnr-bls-missing-round-reviewed.zip -d /tmp/bnr-bls-missing-round-reviewed
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/bnr-bls-missing-round-reviewed")
          review = json.loads(
              Path(
                  "model/calibration_validation/"
                  "bnr_bls_missing_round_promotion_review.json"
              ).read_text(encoding="utf-8")
          )
          actual = {
              str(path.relative_to(root))
              for path in root.rglob("*")
              if path.is_file()
          }
          expected = {item["path"] for item in review["expected_files"]}
          if actual != expected:
              raise SystemExit(
                  f"file set mismatch: missing={expected-actual}, extra={actual-expected}"
              )
          for item in review["expected_files"]:
              data = (root / item["path"]).read_bytes()
              if len(data) != item["bytes"]:
                  raise SystemExit(f"byte-count mismatch: {item['path']}")
              if hashlib.sha256(data).hexdigest() != item["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch: {item['path']}")
              if item["signature"] == "OLE2_CFBF_D0CF11E0A1B11AE1":
                  if not data.startswith(bytes.fromhex("D0CF11E0A1B11AE1")):
                      raise SystemExit(f"not OLE2 XLS: {item['path']}")
              elif item["signature"] == "JSON":
                  json.loads(data.decode("utf-8"))
              else:
                  raise SystemExit(f"unhandled signature: {item['signature']}")
          PY

      - name: Commit immutable source vintage only
        run: |
          dest="data/source_vintages/bnr-bls-missing-round-recovery-vintage-2026-09-19"
          test ! -e "$dest"
          mkdir -p "$dest"
          cp -a /tmp/bnr-bls-missing-round-reviewed/. "$dest/"
          cp             model/calibration_validation/bnr_bls_missing_round_promotion_review.json             "$dest/source_vintage_manifest.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "data: retain exact BNR BLS missing-round vintage"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
