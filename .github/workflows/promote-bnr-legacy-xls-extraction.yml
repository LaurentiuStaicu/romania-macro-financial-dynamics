name: Promote Reviewed BNR Legacy XLS Extraction Vintage

# One-shot retention of the exact reviewed cell-extraction artifact.
# No semantic variable selection, interpolation, model fitting or activation.
on:
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: write

jobs:
  promote-reviewed-extraction:
    if: ${{ github.event.label.name == 'promote-bnr-legacy-xls-extraction' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Download exact reviewed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10582798806/zip" \
            -o /tmp/bnr-xls-extraction-reviewed.zip
          echo "4ba78ffee9504ef919723f7b59db3a34eeec029b03065050035f24492a3de58d  /tmp/bnr-xls-extraction-reviewed.zip" | sha256sum -c -

      - name: Verify every reviewed file
        run: |
          rm -rf /tmp/bnr-xls-extraction-reviewed
          mkdir -p /tmp/bnr-xls-extraction-reviewed
          unzip -q /tmp/bnr-xls-extraction-reviewed.zip -d /tmp/bnr-xls-extraction-reviewed
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root=Path("/tmp/bnr-xls-extraction-reviewed")
          review=json.loads(Path("model/calibration_validation/bnr_legacy_xls_cell_extraction_assessment.json").read_text(encoding="utf-8"))
          actual={str(p.relative_to(root)) for p in root.rglob("*") if p.is_file()}
          expected={item["path"] for item in review["expected_files"]}
          if actual != expected:
              raise SystemExit(f"artifact file set mismatch: missing={expected-actual}, extra={actual-expected}")
          for item in review["expected_files"]:
              data=(root/item["path"]).read_bytes()
              if len(data)!=item["bytes"] or hashlib.sha256(data).hexdigest()!=item["sha256"]:
                  raise SystemExit(f"review mismatch for {item['path']}")
          print("Exact reviewed BNR legacy-XLS extraction artifact verified.")
          PY

      - name: Commit immutable extraction vintage to PR branch
        run: |
          dest="data/source_vintages/bnr-legacy-xls-cell-extraction-vintage-2026-09-19"
          test ! -e "$dest"
          mkdir -p "$dest"
          cp -a /tmp/bnr-xls-extraction-reviewed/. "$dest/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "data: retain deterministic BNR legacy XLS extraction vintage"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
