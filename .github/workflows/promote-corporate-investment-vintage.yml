name: Promote Reviewed Bank Credit Prudential Coverage Vintage

on:
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: write

jobs:
  promote-reviewed-bank-credit-prudential-vintage:
    if: ${{ github.event.label.name == 'promote-corporate-investment-vintage' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Download exact reviewed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10582377035/zip" \
            -o /tmp/bank-credit-prudential-reviewed.zip
          echo "4168935ee09b3449b76907f92c40aff945190bdc2c581c7a76f4ba29697ea87b  /tmp/bank-credit-prudential-reviewed.zip" | sha256sum -c -

      - name: Verify reviewed file set and hashes
        run: |
          rm -rf /tmp/bank-credit-prudential-reviewed
          mkdir -p /tmp/bank-credit-prudential-reviewed
          unzip -q /tmp/bank-credit-prudential-reviewed.zip -d /tmp/bank-credit-prudential-reviewed
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("/tmp/bank-credit-prudential-reviewed")
          review=json.loads(Path("model/calibration_validation/bank_credit_prudential_coverage_promotion_review.json").read_text())
          actual={str(p.relative_to(root)) for p in root.rglob("*") if p.is_file()}
          expected={x["path"] for x in review["expected_files"]}
          if actual != expected:
              raise SystemExit(f"file set mismatch: missing={expected-actual}, extra={actual-expected}")
          for item in review["expected_files"]:
              data=(root/item["path"]).read_bytes()
              if len(data)!=item["bytes"] or hashlib.sha256(data).hexdigest()!=item["sha256"]:
                  raise SystemExit(f"review mismatch: {item['path']}")
          print("Reviewed prudential artifact verified.")
          PY

      - name: Commit immutable prudential source vintage
        run: |
          dest="data/source_vintages/bank-credit-prudential-coverage-vintage-2026-09-19"
          test ! -e "$dest"
          mkdir -p "$dest"
          cp -a /tmp/bank-credit-prudential-reviewed/. "$dest/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "data: retain exact bank-credit prudential coverage vintage"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
