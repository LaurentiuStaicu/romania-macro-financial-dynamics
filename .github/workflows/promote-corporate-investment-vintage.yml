name: Promote Reviewed Corporate Investment Structural Selection Result

# One-shot promotion of the exact reviewed structural-selection result.
# The reviewed verdict is FAIL_BEFORE_HOLDOUT. This workflow must not open
# final evaluation, refit, respecify or activate any behavioural feedback.
on:
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: write

jobs:
  promote-reviewed-selection-result:
    if: ${{ github.event.label.name == 'promote-corporate-investment-vintage' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Download exact reviewed selection artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10582335814/zip" \
            -o /tmp/corporate-investment-selection-reviewed.zip
          echo "011b4c3fdd64744476691b28671af01af1b7f6df12beda9303eeaa4c4a6ab0a1  /tmp/corporate-investment-selection-reviewed.zip" | sha256sum -c -

      - name: Verify exact reviewed result
        run: |
          rm -rf /tmp/corporate-investment-selection-reviewed
          mkdir -p /tmp/corporate-investment-selection-reviewed
          unzip -q /tmp/corporate-investment-selection-reviewed.zip -d /tmp/corporate-investment-selection-reviewed
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root=Path("/tmp/corporate-investment-selection-reviewed")
          review=json.loads(Path(
              "model/calibration_validation/"
              "corporate_investment_structural_selection_promotion_review.json"
          ).read_text(encoding="utf-8"))
          files=[p for p in root.rglob("*") if p.is_file()]
          if len(files) != 1:
              raise SystemExit(f"unexpected reviewed artifact file set: {files}")
          expected=review["expected_file"]
          path=root/expected["path"]
          data=path.read_bytes()
          if len(data)!=expected["bytes"]:
              raise SystemExit("reviewed selection-result byte size mismatch")
          if hashlib.sha256(data).hexdigest()!=expected["sha256"]:
              raise SystemExit("reviewed selection-result SHA-256 mismatch")
          result=json.loads(data)
          assert result["selection_verdict"] == "FAIL_BEFORE_HOLDOUT"
          assert result["final_evaluation_opened"] is False
          assert result["selected_form_for_final_evaluation"] is None
          assert result["system_dynamics_activation"] is False
          print("Exact failed corporate-investment selection result verified.")
          PY

      - name: Commit exact canonical selection result to PR branch
        run: |
          src="/tmp/corporate-investment-selection-reviewed/corporate_investment_structural_selection_result.json"
          dest="model/calibration_validation/corporate_investment_structural_selection_result.json"
          test ! -e "$dest"
          cp "$src" "$dest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "investment: retain failed structural selection result"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
