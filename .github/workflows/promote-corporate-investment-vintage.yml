name: Promote Reviewed Corporate Investment Measurement Panel

# One-shot promotion of the exact reviewed derived measurement panel.
# No provider refetch, estimation, model selection, holdout opening or activation.
on:
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: write

jobs:
  promote-reviewed-measurement-panel:
    if: ${{ github.event.label.name == 'promote-corporate-investment-vintage' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Download exact reviewed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10582279137/zip" \
            -o /tmp/corporate-investment-panel-reviewed.zip
          echo "52b6cf33101d80b2ed868d15cbc63a8ed9cc319a4eb7803e77d8742a26d92e6f  /tmp/corporate-investment-panel-reviewed.zip" | sha256sum -c -

      - name: Verify every reviewed file
        run: |
          rm -rf /tmp/corporate-investment-panel-reviewed
          mkdir -p /tmp/corporate-investment-panel-reviewed
          unzip -q /tmp/corporate-investment-panel-reviewed.zip -d /tmp/corporate-investment-panel-reviewed
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root=Path("/tmp/corporate-investment-panel-reviewed")
          review=json.loads(Path(
              "model/calibration_validation/"
              "corporate_investment_measurement_panel_promotion_review.json"
          ).read_text(encoding="utf-8"))
          actual={str(p.relative_to(root)) for p in root.rglob("*") if p.is_file()}
          expected={item["path"] for item in review["expected_files"]}
          if actual != expected:
              raise SystemExit(f"artifact file set mismatch: missing={expected-actual}, extra={actual-expected}")
          for item in review["expected_files"]:
              data=(root/item["path"]).read_bytes()
              if len(data)!=item["bytes"] or hashlib.sha256(data).hexdigest()!=item["sha256"]:
                  raise SystemExit(f"review mismatch for {item['path']}")
          print("Exact reviewed corporate-investment measurement panel verified.")
          PY

      - name: Commit immutable measurement-panel vintage to PR branch
        run: |
          dest="data/source_vintages/corporate-investment-measurement-panel-vintage-2026-09-19"
          test ! -e "$dest"
          mkdir -p "$dest"
          cp -a /tmp/corporate-investment-panel-reviewed/. "$dest/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "data: retain corporate-investment measurement panel vintage"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
