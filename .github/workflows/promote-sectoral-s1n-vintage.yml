name: Promote Reviewed Sectoral S1N Diagnostic Vintage

# One-shot retention of the exact reviewed negative S1N diagnostic artifact.
# No provider refetch, historical reinterpretation, reference-mode promotion,
# tolerance change, residual allocation, or behavioural activation.
on:
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: write

jobs:
  promote-reviewed-s1n-diagnostic:
    if: ${{ github.event.label.name == 'promote-sectoral-s1n-vintage' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Download exact reviewed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10582468766/zip" \
            -o /tmp/s1n-reviewed.zip
          echo "71c3b879233b4f088264fc05382c2e6b2c3f906ed9e059d2469f74ee6a267d0f  /tmp/s1n-reviewed.zip" | sha256sum -c -

      - name: Verify every reviewed file
        run: |
          rm -rf /tmp/s1n-reviewed
          mkdir -p /tmp/s1n-reviewed
          unzip -q /tmp/s1n-reviewed.zip -d /tmp/s1n-reviewed
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/s1n-reviewed")
          review = json.loads(
              Path(
                  "model/dynamics/"
                  "sectoral_financial_positions_s1n_boundary_diagnostic_assessment.json"
              ).read_text(encoding="utf-8")
          )
          actual = {
              str(path.relative_to(root))
              for path in root.rglob("*")
              if path.is_file()
          }
          expected = {item["path"] for item in review["expected_files"]}
          if actual != expected:
              raise SystemExit(
                  f"artifact file set mismatch: missing={expected-actual}, "
                  f"extra={actual-expected}"
              )
          for item in review["expected_files"]:
              path = root / item["path"]
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != item["bytes"] or digest != item["sha256"]:
                  raise SystemExit(f"review mismatch for {item['path']}")
          print("Exact reviewed negative S1N diagnostic artifact verified.")
          PY

      - name: Commit immutable diagnostic vintage to PR branch
        run: |
          dest="data/source_vintages/sectoral-financial-positions-s1n-boundary-vintage-2026-09-19"
          test ! -e "$dest"
          mkdir -p "$dest"
          cp -a /tmp/s1n-reviewed/. "$dest/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "data: retain negative sectoral S1N diagnostic vintage"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
