name: Temporary Legacy Provenance Materialization

on:
  push:
    branches:
      - repair/provenance-chain

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: repair/provenance-chain

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch current official-source payloads
        env:
          RECOVERY_OUT: provenance_live
          RECOVERY_SNAPSHOT_ID: legacy-recovery-audit-${{ github.sha }}
        run: python scripts/fetch_validation_recovery_data.py

      - name: Materialize only byte-identical legacy payloads
        env:
          AUDIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          legacy_path = Path("data/raw/validation_recovery/fetch_manifest.json")
          live_path = Path("provenance_live/snapshot_manifest.json")
          legacy = json.loads(legacy_path.read_text(encoding="utf-8"))
          live = json.loads(live_path.read_text(encoding="utf-8"))
          legacy_by_name = {item["name"]: item for item in legacy["attempts"]}
          live_by_name = {item["name"]: item for item in live["attempts"]}

          target = Path("data/source_vintages/validation-recovery-2026-09-17")
          raw_target = target / "raw"
          raw_target.mkdir(parents=True, exist_ok=True)

          results = []
          for name in sorted(legacy_by_name):
              historical = legacy_by_name[name]
              current = live_by_name.get(name)
              exact = bool(current and current["sha256"] == historical["sha256"])
              row = {
                  "name": name,
                  "legacy_sha256": historical["sha256"],
                  "live_sha256": current["sha256"] if current else None,
                  "status": "BYTE_IDENTICAL_RECOVERED" if exact else "NOT_RECOVERED_RAW_HASH_MISMATCH",
              }
              if exact:
                  source = Path("provenance_live") / current["path"]
                  destination = raw_target / source.name
                  shutil.copyfile(source, destination)
                  row["path"] = str(destination.relative_to(target))
              results.append(row)

          manifest = {
              "recovery_manifest_version": "0.1",
              "legacy_snapshot_id": "validation-recovery-2026-09-17",
              "legacy_manifest": str(legacy_path),
              "materialized_at_utc": datetime.now(timezone.utc).isoformat(),
              "audit_commit_sha": os.environ["AUDIT_COMMIT_SHA"],
              "complete_raw_vintage_recovered": all(
                  row["status"] == "BYTE_IDENTICAL_RECOVERED" for row in results
              ),
              "sources": results,
              "rule": "Only payloads with exact SHA-256 equality to the v0.1.0 legacy manifest are materialized as historical raw bytes.",
          }
          (target / "recovery_manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit recovered legacy payloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source_vintages/validation-recovery-2026-09-17
          if git diff --cached --quiet; then
            echo "No materialization changes."
            exit 0
          fi
          git commit -m "provenance: materialize byte-identical legacy source payloads"
          git push origin HEAD:repair/provenance-chain
