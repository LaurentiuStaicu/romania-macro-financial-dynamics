name: Sectoral Financial Positions Phase B Audit


# Phase B live QSA source refresh is manual-only after the retained immutable
# reconciliation-failure run. Canonical scientific state is reproduced offline.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-sectoral-financial-positions-phase-b:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify preregistered Phase B aggregate-identity contract
        run: python -m unittest tests.test_sectoral_financial_positions_aggregate_identity_contract -v

      - name: Probe ECB QSA exact F minus F1 identity
        env:
          SECTORAL_POSITIONS_PHASE_B_AUDIT_OUT: sectoral_positions_phase_b_audit_artifacts
        run: python scripts/audit_ecb_sectoral_financial_positions_phase_b.py

      - name: Upload Phase B source-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sectoral-financial-positions-phase-b-${{ github.sha }}
          path: sectoral_positions_phase_b_audit_artifacts/
          if-no-files-found: error
          retention-days: 90
