name: Sectoral Financial Positions Source Discrepancy Diagnostic

on:
  pull_request:
    paths:
      - "model/dynamics/sectoral_financial_positions_source_discrepancy_contract.json"
      - "scripts/audit_ecb_sectoral_financial_positions_source_discrepancy.py"
      - "tests/test_sectoral_financial_positions_source_discrepancy_contract.py"
      - ".github/workflows/sectoral-financial-positions-source-discrepancy-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-sectoral-financial-positions-source-discrepancy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify preregistered Phase D diagnostic contract
        run: python -m unittest tests.test_sectoral_financial_positions_source_discrepancy_contract -v

      - name: Localize ECB QSA sector-vs-total-vs-external discrepancy
        env:
          SECTORAL_POSITIONS_PHASE_D_AUDIT_OUT: sectoral_positions_phase_d_audit_artifacts
        run: python scripts/audit_ecb_sectoral_financial_positions_source_discrepancy.py

      - name: Upload Phase D diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sectoral-financial-positions-phase-d-${{ github.sha }}
          path: sectoral_positions_phase_d_audit_artifacts/
          if-no-files-found: error
          retention-days: 90
