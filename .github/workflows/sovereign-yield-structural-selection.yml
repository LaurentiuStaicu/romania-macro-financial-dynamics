name: Sovereign Yield Structural Selection

# Offline-only execution on the retained source vintage. This workflow never
# calls data providers and may run only when the explicit PR label is applied.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  run-frozen-structural-selection:
    if: ${{ github.event.label.name == 'run-sovereign-yield-selection' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install current package
        run: python -m pip install --no-deps .

      - name: Verify frozen contract, runner and gate
        run: |
          python -m unittest             tests.test_sovereign_yield_source_vintage             tests.test_sovereign_yield_structural_selection_contract             tests.test_sovereign_yield_selection_runner -v

      - name: Execute frozen structural-selection window only
        run: python scripts/run_sovereign_yield_structural_selection.py --execute-selection

      - name: Verify final evaluation remains unopened
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("model/calibration_validation/sovereign_yield_structural_selection_result.json")
          result = json.loads(p.read_text(encoding="utf-8"))
          assert result["final_evaluation_opened"] is False
          assert result["causal_claim_allowed"] is False
          assert result["system_dynamics_activation"] is False
          assert result["behavioural_closure_change"] is False
          print(result["selection_verdict"])
          PY

      - name: Commit immutable selection result to PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/calibration_validation/sovereign_yield_structural_selection_result.json
          git diff --cached --exit-code && {
            echo "No selection result staged"
            exit 1
          } || true
          git commit -m "validation: retain frozen sovereign-yield structural selection"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
