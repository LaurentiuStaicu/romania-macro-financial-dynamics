name: Promote Reviewed Sovereign Yield Vintage

# Promotion is separate from live source materialisation. It may run only when
# an explicit PR label is applied after human/model review of an exact artifact.
# No provider is called here and no estimation is performed.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  actions: read

jobs:
  promote-reviewed-vintage:
    if: ${{ github.event.label.name == 'promote-reviewed-sovereign-yield-vintage' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download exact reviewed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(python -c 'import json; p=json.load(open("model/calibration_validation/sovereign_yield_source_vintage_promotion_review.json")); print(p["reviewed_workflow"]["artifact_id"])')"
          EXPECTED_SHA="$(python -c 'import json; p=json.load(open("model/calibration_validation/sovereign_yield_source_vintage_promotion_review.json")); print(p["reviewed_workflow"]["artifact_zip_sha256"])')"
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o reviewed-artifact.zip
          echo "${EXPECTED_SHA}  reviewed-artifact.zip" | sha256sum --check
          mkdir reviewed-artifact
          unzip -q reviewed-artifact.zip -d reviewed-artifact

      - name: Verify and stage immutable source vintage
        run: |
          python scripts/verify_sovereign_yield_vintage_promotion.py \
            reviewed-artifact \
            data/source_vintages/sovereign-yield-quarterly-vintage-2026-09-19
          git add data/source_vintages/sovereign-yield-quarterly-vintage-2026-09-19

      - name: Commit exact reviewed vintage to PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --exit-code && {
            echo "No source-vintage changes staged"
            exit 1
          } || true
          git commit -m "data: retain reviewed sovereign-yield quarterly source vintage"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
