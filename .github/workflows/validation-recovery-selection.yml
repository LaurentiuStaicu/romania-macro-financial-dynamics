name: Validation recovery selection

on:
  push:
    branches:
      - alpha-0.5.1a0-validation-recovery
    paths:
      - src/romania_macro_financial_dynamics/validation_recovery.py
      - scripts/run_validation_recovery_selection.py
      - model/calibration_validation/validation_recovery_contract.json
      - data/provenance/validation_recovery_split_0.5.1a0.json
      - data/raw/validation_recovery/**
      - .github/workflows/validation-recovery-selection.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-0.5.1a0-validation-recovery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific core
        run: python -m pip install -e '.[test]'
      - name: Run preregistered calibration and structural selection
        run: python scripts/run_validation_recovery_selection.py
      - name: Run recovery tests
        run: python -m pytest -q tests/test_validation_recovery.py
      - name: Persist selection result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/calibration_validation/validation_recovery_selection.json
          if ! git diff --cached --quiet; then
            git commit -m "science: persist preregistered validation recovery selection"
            git push origin HEAD:alpha-0.5.1a0-validation-recovery
          fi
      - name: Upload selection diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: validation-recovery-selection
          path: model/calibration_validation/validation_recovery_selection.json
          if-no-files-found: error
