[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "romanian-monetary-dynamics"
version = "0.1.0"
description = "Accounting-constrained stock-flow-consistent dynamic model of Romania's monetary and macro-financial system"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Laurentiu Staicu"}]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12"
]

[tool.hatch.build.targets.wheel]
packages = ["src/romania_macro_financial_dynamics"]